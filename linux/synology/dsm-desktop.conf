# Registered through DSM web-config; package lifecycle manages this include.
location = /ugreen-toolbox {
    return 302 /ugreen-toolbox/;
}
location ^~ /ugreen-toolbox/ {
    if ($scheme != https) { return 403; }
    proxy_pass http://127.0.0.1:5088/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-UGREEN-DSM-Proxy 1;
    proxy_set_header Authorization $http_authorization;
    # Do not pass DSM login cookies to the application backend.
    proxy_set_header Cookie "ugreen_toolbox_session=$cookie_ugreen_toolbox_session";
    proxy_set_header Connection "";
    client_max_body_size 64k;
    proxy_read_timeout 90s;
    proxy_buffering off;
}
